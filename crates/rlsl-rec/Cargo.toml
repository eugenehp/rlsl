[package]
name = "rlsl-rec"
description = "Real Life Streaming Layer recorder with TUI — records LSL streams to XDF files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rlsl_rec"
path = "src/lib.rs"

[[bin]]
name = "rlsl-rec"
path = "src/main.rs"

[dependencies]
rlsl.workspace = true
exg.workspace = true
tokio.workspace = true
futures.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
ratatui.workspace = true
crossterm.workspace = true
anyhow.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json = "1.0"
arrow = { version = "60", features = ["prettyprint"] }
parquet = { version = "60", features = ["arrow", "zstd"] }

# HDF5 recordings (`RecordingFormat::Hdf5`), written by a pure-Rust HDF5 implementation: no
# libhdf5 to install. Off by default.
hdf5 = { package = "hdf5-no-c", version = "0.1.3", optional = true }
ndarray = { version = "0.15", optional = true }

[features]
default = []
# Record to HDF5 (one `.h5` file per recording).
hdf5 = ["dep:hdf5", "dep:ndarray"]
