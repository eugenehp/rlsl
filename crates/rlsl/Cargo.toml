[package]
name = "rlsl"
description = "Real Life Streaming Layer — pure Rust core library"
version.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
tokio.workspace = true
socket2.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
once_cell.workspace = true
uuid.workspace = true
hostname.workspace = true
fxhash.workspace = true
log.workspace = true

# Stream compression between rlsl inlets and outlets (see `compress`). Off by default: the
# core then has no C dependency and behaves on the wire exactly as before.
zstd = { version = "0.14", optional = true }
# DNS-SD (Bonjour / Avahi) announcements and browsing, for the `mdns` feature. No async runtime.
mdns-sd = { version = "0.21", optional = true, default-features = false }

[features]
default = []
compression = ["dep:zstd"]
# A standard NTP server and client (see `ntp`): serve this machine's clock to devices that only
# speak NTP, and map LSL time stamps onto an NTP server's UTC. Off by default; no dependencies.
ntp = []
# liblsl's behaviour where rlsl's own has differed since its first release: `local_clock()` is
# the machine clock, `time_correction()` has liblsl's sign, and `PROC_CLOCKSYNC` synchronises by
# itself. Off by default, so that existing programs behave as they always have; each of the
# three can also be chosen at run time (see the `clock` module and `StreamInlet`). The C
# library (`rlsl-sys`, the liblsl drop-in) behaves like liblsl without this feature.
liblsl-defaults = []
# Streams are also announced by DNS-SD (Bonjour, Avahi) as `_lsl._tcp` services, and a resolver
# also asks the machines that announce some: found on networks that carry mDNS and not LSL's own
# multicast groups, and visible to any DNS-SD browser. What a resolver returns is the same —
# the announcement only says where to ask. Off by default; `LSL_MDNS=0` switches it off at run
# time. Nothing changes for peers without it.
mdns = ["dep:mdns-sd"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion.workspace = true
anyhow.workspace = true

[[bench]]
name = "sample_bench"
harness = false

[[example]]
name = "ntp_bench"
required-features = ["ntp"]
